name: AppLocker readiness tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  applocker-readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Safety and readiness fixtures on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/AppLockerReadiness.Tests.ps1
      - name: Native read-only observations on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/AppLockerReadiness.Windows.Tests.ps1
      - name: Safety and readiness fixtures on PowerShell 7
        shell: pwsh
        run: ./tests/AppLockerReadiness.Tests.ps1
      - name: Native read-only observations on PowerShell 7
        shell: pwsh
        run: ./tests/AppLockerReadiness.Windows.Tests.ps1
