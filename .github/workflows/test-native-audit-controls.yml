name: Native audit control regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify native policy masks and dependencies (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/NativeAuditControls.Tests.ps1
      - name: Verify native policy masks and dependencies (PowerShell 7)
        shell: pwsh
        run: ./tests/NativeAuditControls.Tests.ps1
