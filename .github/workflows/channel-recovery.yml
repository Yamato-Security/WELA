name: Reviewed native channel recovery
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  channel-recovery:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Focused and native public recovery on Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: |
          ./tests/ChannelRecovery.Tests.ps1
          ./tests/ChannelRecovery.Cli.Tests.ps1
          ./tests/ChannelRecovery.Windows.Tests.ps1 -AllowDisposableChannelWrite
      - name: Focused and native public recovery on PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: |
          ./tests/ChannelRecovery.Tests.ps1
          ./tests/ChannelRecovery.Cli.Tests.ps1
          ./tests/ChannelRecovery.Windows.Tests.ps1 -AllowDisposableChannelWrite
      - name: Retain native original, restoration and cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: channel-recovery-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wela-channel-recovery-*/
          if-no-files-found: warn
          retention-days: 7
