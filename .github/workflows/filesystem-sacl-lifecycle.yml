name: Native public filesystem SACL lifecycle
on:
  push:
    branches: ['**']
    paths:
      - 'tests/FileSacl*'
      - 'tests/RegistrySaclFixtureNative.cs'
      - 'tests/SelectedSaclFixtureProtection.cs'
      - 'scripts/SelectedSacl*'
      - 'scripts/TargetedSaclPlanning.ps1'
      - 'scripts/FileAccessProbe*'
      - 'WELA.ps1'
      - '.github/workflows/filesystem-sacl-lifecycle.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filesystem-sacl-lifecycle:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Owned public filesystem lifecycle in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/FileSaclLifecycle.Windows.Tests.ps1 -AllowDisposableProfileWrite
      - name: Owned public filesystem lifecycle in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/FileSaclLifecycle.Windows.Tests.ps1 -AllowDisposableProfileWrite
      - name: Retain public receipts and exact owned-fixture cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: filesystem-sacl-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wela-filesystem-lifecycle-*/
          if-no-files-found: error
