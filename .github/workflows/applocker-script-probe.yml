name: Native AppLocker Script probe
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  applocker-script-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Fixtures in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: |
          ./tests/AppLockerScriptProbe.Tests.ps1
          ./tests/AppLockerScriptProbe.Cli.Tests.ps1
      - name: Native probe in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/AppLockerScriptProbe.Windows.Tests.ps1 -AllowDisposablePolicyWrite
      - name: Fixtures in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: |
          ./tests/AppLockerScriptProbe.Tests.ps1
          ./tests/AppLockerScriptProbe.Cli.Tests.ps1
      - name: Native probe in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/AppLockerScriptProbe.Windows.Tests.ps1 -AllowDisposablePolicyWrite
      - name: Retain bounded native evidence and cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: applocker-script-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wela-applocker-script-native-*/**
          retention-days: 7
          if-no-files-found: warn
