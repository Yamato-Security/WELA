name: Native AppLocker EXE probe
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  applocker-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Fixtures in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/AppLockerProbe.Tests.ps1
      - name: Native probe in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/AppLockerProbe.Windows.Tests.ps1 -AllowDisposablePolicyWrite
      - name: Fixtures in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/AppLockerProbe.Tests.ps1
      - name: Native probe in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/AppLockerProbe.Windows.Tests.ps1 -AllowDisposablePolicyWrite
