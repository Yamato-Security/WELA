name: Targeted SACL planning tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-sacl-planning:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Planning fixtures and CLI on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/TargetedSaclPlanning.Tests.ps1
      - name: Planning fixtures and CLI on PowerShell 7
        shell: pwsh
        run: ./tests/TargetedSaclPlanning.Tests.ps1
      - name: Native read-only observations on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/TargetedSaclPlanning.Windows.Tests.ps1
      - name: Native read-only observations on PowerShell 7
        shell: pwsh
        run: ./tests/TargetedSaclPlanning.Windows.Tests.ps1
