name: Outgoing NTLM regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test outgoing NTLM policy without changing host settings
        shell: ${{ matrix.shell }}
        run: ./tests/OutgoingNtlm.Tests.ps1
