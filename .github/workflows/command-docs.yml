name: Command documentation parity

on:
  push:
    branches: ['**']
    paths:
      - 'WELA.ps1'
      - 'README.md'
      - 'website/docs/commands/**'
      - 'website/mkdocs.yml'
      - 'tests/CommandDocs.Tests.ps1'
      - '.github/workflows/command-docs.yml'
  pull_request:
    paths:
      - 'WELA.ps1'
      - 'README.md'
      - 'website/docs/commands/**'
      - 'website/mkdocs.yml'
      - 'tests/CommandDocs.Tests.ps1'
      - '.github/workflows/command-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify command and language parity
        shell: pwsh
        run: ./tests/CommandDocs.Tests.ps1
