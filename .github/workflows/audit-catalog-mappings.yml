name: Audit catalog mapping regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-catalog-mappings:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Catalog, ambiguity and renderer fixtures on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/AuditCatalogMappings.Tests.ps1
      - name: Native identifier observations on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/AuditCatalogMappings.Windows.Tests.ps1
      - name: Catalog, ambiguity and renderer fixtures on PowerShell 7
        shell: pwsh
        run: ./tests/AuditCatalogMappings.Tests.ps1
      - name: Native identifier observations on PowerShell 7
        shell: pwsh
        run: ./tests/AuditCatalogMappings.Windows.Tests.ps1
