name: Offline Intune audit export regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-export:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: DDF and export regressions in Windows PowerShell 5.1
        shell: powershell
        timeout-minutes: 3
        run: ./tests/IntuneAuditExport.Tests.ps1
      - name: DDF and export regressions in PowerShell 7
        shell: pwsh
        timeout-minutes: 3
        run: ./tests/IntuneAuditExport.Tests.ps1
      - name: Public offline CLI in Windows PowerShell 5.1
        shell: powershell
        timeout-minutes: 3
        run: ./tests/IntuneAuditExport.Cli.Tests.ps1
      - name: Public offline CLI in PowerShell 7
        shell: pwsh
        timeout-minutes: 3
        run: ./tests/IntuneAuditExport.Cli.Tests.ps1
