name: Native token right adjustment probe
on:
  push:
    branches: ['**']
    paths:
      - 'scripts/TokenRightProbe*'
      - 'tests/TokenRightProbe*'
      - '.github/workflows/token-right-probe.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  token-right-probe:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Native adjustment feasibility in Windows PowerShell
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/TokenRightProbe.Feasibility.ps1 -AllowDisposableAuditWrite
      - name: Native adjustment feasibility in PowerShell7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/TokenRightProbe.Feasibility.ps1 -AllowDisposableAuditWrite
      - name: Retain native events and cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: token-right-probe-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wela-token-right-feasibility-*/
          if-no-files-found: error
