name: LDAP diagnostic regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ldap-diagnostics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: LDAP fixtures on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/LdapDiagnostics.Tests.ps1
      - name: Native applicability on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/LdapDiagnostics.Windows.Tests.ps1
      - name: LDAP fixtures on PowerShell 7
        shell: pwsh
        run: ./tests/LdapDiagnostics.Tests.ps1
      - name: Native applicability on PowerShell 7
        shell: pwsh
        run: ./tests/LdapDiagnostics.Windows.Tests.ps1
