name: Scoped process command-line auditing
on:
  push:
    branches: ['**']
    paths:
      - 'WELA.ps1'
      - 'scripts/ProcessCommandline.ps1'
      - 'scripts/Configuration.ps1'
      - 'scripts/NativeValidation.ps1'
      - 'scripts/ControlApplicability.ps1'
      - 'tests/ProcessCommandline*'
      - '.github/workflows/process-commandline.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-commandline:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Scoped audit tests in Windows PowerShell
        if: matrix.engine == 'powershell'
        shell: powershell
        run: |
          ./tests/ProcessCommandline.Tests.ps1
          ./tests/ProcessCommandline.Cli.Tests.ps1
          ./tests/ProcessCommandline.Windows.Tests.ps1 -AllowDisposableAuditWrite
      - name: Scoped audit tests in PowerShell7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: |
          ./tests/ProcessCommandline.Tests.ps1
          ./tests/ProcessCommandline.Cli.Tests.ps1
          ./tests/ProcessCommandline.Windows.Tests.ps1 -AllowDisposableAuditWrite
      - name: Retain typed originals, results and cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: process-commandline-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wela-process-commandline-*/
          if-no-files-found: error
