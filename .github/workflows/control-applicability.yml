name: Control applicability and default evidence
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-applicability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fixtures on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/ControlApplicability.Tests.ps1
      - name: Native read-only capture on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/ControlApplicability.Windows.Tests.ps1
      - name: Fixtures on PowerShell 7
        shell: pwsh
        run: ./tests/ControlApplicability.Tests.ps1
      - name: Native read-only capture on PowerShell 7
        shell: pwsh
        run: ./tests/ControlApplicability.Windows.Tests.ps1
