name: WELA Release Automation

on:
  workflow_dispatch:
    inputs:
      release_ver:
        required: true
        default: "1.0.0"
        description: "Version of the release"
      branch_or_tag:
        required: true
        default: "main"
        description: "Branch or Tag to checkout"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ${{ matrix.info.os }}
    strategy:
      matrix:
        info:
          - { os: "windows-latest" }
          - { os: "macos-latest" }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch_or_tag }}
          submodules: 'true'

      - name: Package and Zip - Windows
        if: contains(matrix.info.os, 'windows') == true
        shell: pwsh
        run: |
          mkdir -p release-binaries
          Copy-Item -Path WELA.ps1 -Destination release-binaries/
          Copy-Item -Recurse -Path ./config -Destination release-binaries/

      - name: Set Artifact Name
        if: contains(matrix.info.os, 'windows') == true
        id: set_artifact_name
        shell: bash
        run: |
          echo "artifact_name=wela-${{ github.event.inputs.release_ver }}" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        if: contains(matrix.info.os, 'windows') == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.set_artifact_name.outputs.artifact_name }}
          path: release-binaries/*

      - name: Setup node
        if: matrix.info.os == 'macos-latest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Create PDF
        if: matrix.info.os == 'macos-latest'
        run: |
          npm i -g md-to-pdf
          md-to-pdf ./OLD-README.md ./OLD-README-Japanese.md --md-file-encoding utf-8
          mv ./OLD-README.pdf ./README-${{ github.event.inputs.release_ver }}-English.pdf
          mv ./OLD-README-Japanese.pdf ./README-${{ github.event.inputs.release_ver }}-Japanese.pdf

      - name: Upload Document Artifacts
        if: matrix.info.os == 'macos-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wela-documents
          path: |
            ./*.pdf