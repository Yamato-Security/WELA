name: Configuration result regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration-results:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Mocked regression tests (no Windows configuration changes)
        shell: ${{ matrix.shell }}
        run: ./tests/Test-ConfigurationResults.ps1
      - name: Real Windows read-only smoke tests
        shell: ${{ matrix.shell }}
        run: ./tests/Test-ConfigurationReadOnlyWindows.ps1
