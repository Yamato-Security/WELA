name: Custom audit profile regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  custom-profiles:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Strict input and mocked configuration on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/CustomAuditProfiles.Tests.ps1
      - name: Native read-only custom audit on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/CustomAuditProfiles.Windows.Tests.ps1
      - name: Strict input and mocked configuration on PowerShell 7
        shell: pwsh
        run: ./tests/CustomAuditProfiles.Tests.ps1
      - name: Native read-only custom audit on PowerShell 7
        shell: pwsh
        run: ./tests/CustomAuditProfiles.Windows.Tests.ps1
