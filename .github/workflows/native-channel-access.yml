name: Native channel access regressions
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-channel-access:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Safe command and runner fixtures in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/NativeChannelAccess.Tests.ps1
      - name: Safe command and runner fixtures in PowerShell 7
        shell: pwsh
        run: ./tests/NativeChannelAccess.Tests.ps1
      - name: Real descriptor and read-only CLI smoke in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/NativeChannelAccess.Windows.Tests.ps1
      - name: Real descriptor and read-only CLI smoke in PowerShell 7
        shell: pwsh
        run: ./tests/NativeChannelAccess.Windows.Tests.ps1
