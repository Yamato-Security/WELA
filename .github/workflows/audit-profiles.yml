name: Audit profile regression tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test shared profiles in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/audit-profiles.Tests.ps1
      - name: Test shared profiles in PowerShell 7
        shell: pwsh
        run: ./tests/audit-profiles.Tests.ps1
      - name: Read all effective policies using native API in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/audit-profiles.Windows.Tests.ps1
      - name: Read all effective policies using native API in PowerShell 7
        shell: pwsh
        run: ./tests/audit-profiles.Windows.Tests.ps1
