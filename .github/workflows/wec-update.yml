name: Reviewed disabled WEC subscription updates
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wec-update:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Guard and failure fixtures in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/WecUpdate.Tests.ps1
      - name: Actual disabled-subscription updates in Windows PowerShell 5.1
        if: matrix.engine == 'powershell'
        shell: powershell
        run: ./tests/WecUpdate.Windows.Tests.ps1 -AllowDisposableSubscription
      - name: Guard and failure fixtures in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/WecUpdate.Tests.ps1
      - name: Actual disabled-subscription updates in PowerShell 7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: ./tests/WecUpdate.Windows.Tests.ps1 -AllowDisposableSubscription
