name: Native fixed registry value probe
on:
  push:
    branches: ['**']
    paths:
      - 'WELA.ps1'
      - 'scripts/RegistryValueProbe*'
      - 'scripts/FileAccessProbe.ps1'
      - 'scripts/ChannelRead*'
      - 'scripts/Configuration.ps1'
      - 'tests/RegistryValueProbe*'
      - '.github/workflows/registry-value-probe.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-value-probe:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        engine: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Scoped audit tests in Windows PowerShell
        if: matrix.engine == 'powershell'
        shell: powershell
        run: |
          ./tests/RegistryValueProbe.Tests.ps1
          ./tests/RegistryValueProbe.Cli.Tests.ps1
          ./tests/RegistryValueProbe.Windows.Tests.ps1 -AllowDisposableRegistryProbe
      - name: Scoped audit tests in PowerShell7
        if: matrix.engine == 'pwsh'
        shell: pwsh
        run: |
          ./tests/RegistryValueProbe.Tests.ps1
          ./tests/RegistryValueProbe.Cli.Tests.ps1
          ./tests/RegistryValueProbe.Windows.Tests.ps1 -AllowDisposableRegistryProbe
      - name: Retain typed originals, results and cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registry-value-probe-${{ matrix.os }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/wela-registry-value-probe-*/
          if-no-files-found: error
