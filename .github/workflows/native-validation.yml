name: Native 4688 validation collection
on:
  push:
    branches: ['**']
    paths:
      - 'WELA.ps1'
      - 'scripts/NativeValidation.ps1'
      - 'scripts/ControlApplicability.ps1'
      - 'scripts/Configuration.ps1'
      - 'modules/AuditProfiles.psm1'
      - 'tests/NativeValidation*'
      - '.github/workflows/native-validation.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Synthetic rejection regressions in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/NativeValidation.Tests.ps1
      - name: Actual native 4688 probe with exact disposable policy restoration
        shell: powershell
        run: ./tests/NativeValidation.Windows.Tests.ps1 -AllowDisposablePolicyWrite
      - name: Synthetic rejection regressions in PowerShell 7
        shell: pwsh
        run: ./tests/NativeValidation.Tests.ps1
      - name: Actual native 4688 probe from PowerShell 7 with restoration
        shell: pwsh
        run: ./tests/NativeValidation.Windows.Tests.ps1 -AllowDisposablePolicyWrite
